# PostgreSQL for local development.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: seasa-postgres
    environment:
      POSTGRES_USER: seasa
      POSTGRES_PASSWORD: seasa
      POSTGRES_DB: seasa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seasa -d seasa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
