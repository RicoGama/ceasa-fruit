# PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: ceasa-postgres
    environment:
      POSTGRES_USER: ceasa
      POSTGRES_PASSWORD: ceasa
      POSTGRES_DB: ceasa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceasa -d ceasa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
