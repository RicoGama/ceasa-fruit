# O sqlc lê o schema (migrations) + queries e gera código Go tipado.
# Cada bloco "-- name: X :tipo" em internal/db/queries vira um método Go:
#   :one = uma linha, :many = lista, :exec = nada, :execrows = linhas afetadas.
# sqlc.narg('x') marca um parâmetro que pode ser NULL (vira ponteiro em Go).
version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true # coluna NULL vira *string, *bool...
        emit_interface: true               # gera a interface Querier (útil para testes)
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          # Tipos decimais (ver migration 00003). Nunca float64 para dinheiro.
          - db_type: money_amount
            go_type: github.com/RicoGama/ceasa-fruit/api/internal/money.Money
          - db_type: money_amount
            nullable: true
            go_type:
              import: github.com/RicoGama/ceasa-fruit/api/internal/money
              type: Money
              pointer: true
          - db_type: percent_rate
            go_type: github.com/RicoGama/ceasa-fruit/api/internal/money.Percent
          - db_type: percent_rate
            nullable: true
            go_type:
              import: github.com/RicoGama/ceasa-fruit/api/internal/money
              type: Percent
              pointer: true
          - db_type: quantity_amount
            go_type: github.com/RicoGama/ceasa-fruit/api/internal/quantity.Quantity
          - db_type: quantity_amount
            nullable: true
            go_type:
              import: github.com/RicoGama/ceasa-fruit/api/internal/quantity
              type: Quantity
              pointer: true
