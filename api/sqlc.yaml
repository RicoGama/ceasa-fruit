# O sqlc lê o schema (migrations) + queries e gera código Go tipado.
# Cada bloco "-- name: X :tipo" em internal/db/queries vira um método Go:
#   :one = uma linha, :many = lista, :exec = nada, :execrows = linhas afetadas.
# sqlc.narg('x') marca um parâmetro que pode ser NULL (vira ponteiro em Go).
version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true # coluna NULL vira *string, *bool...
        emit_interface: true               # gera a interface Querier (útil para testes)
        overrides:
          - db_type: timestamptz
            go_type: time.Time
